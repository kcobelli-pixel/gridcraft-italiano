# Rebuilds each new GridCraft release (storytold/gridcraft) with this repository's patches and
# publishes the result as a release of this repository, tagged like upstream:
#   Windows x64 (MSI, portable zip): the Italian catalog and the Brother print fix
#     (apply_print_fix.sh of kcobelli-pixel/pdfcraft-stampa, the fix PdfCraft gets);
#   macOS universal (DMG): the Italian catalog.
# windows/GridCraft-Italiano.ps1 and mac/Applica-italiano.command install the build matching the
# installed GridCraft version. ITALIANO-UFFICIALE.txt says upstream ships Italian itself, and a
# platform whose patches are all official gets PATCH-UFFICIALE-<platform>.txt instead of a build.
#
# A platform counts as published once SHA256SUMS.txt (always uploaded last) lists its package, or
# its marker is there. Only missing platforms are built, and one failing never holds back the
# other: the next hourly run retries just the missing one.
name: Build Italian GridCraft

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'GridCraft tag, e.g. v0.10.0 (empty: the latest release)'
        required: false

permissions: {}

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      build: ${{ steps.pick.outputs.build }}
      exists: ${{ steps.pick.outputs.exists }}
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Pick the tag and the missing platforms
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$(gh release view -R storytold/gridcraft --json tagName --jq .tagName)}"
          # The tag comes from upstream: only plain release tags reach a shell or a file name.
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::unexpected tag '$tag'"; exit 1; fi
          v="${tag#v}"
          assets='' sums=''
          if assets="$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/tmp/err)"; then
            exists=true
            sums="$(gh release download "$tag" -R "$GITHUB_REPOSITORY" -p SHA256SUMS.txt -O - 2>/dev/null)" || sums=''
          elif grep -q 'release not found' /tmp/err; then
            exists=false
          else
            echo "::error::checking for $tag failed: $(cat /tmp/err)"; exit 1
          fi
          listed() { awk -v n="$1" 'length($1) == 64 && $1 ~ /^[0-9a-f]+$/ && ($2 == n || $2 == "*" n) { f = 1 } END { exit !f }' <<<"$sums"; }
          legs='[]'
          # A Windows package counts once its receipt (PATCHES-windows.txt, the patches it has) is
          # there too, so builds from before the print fix are made again.
          if ! grep -qx PATCH-UFFICIALE-windows.txt <<<"$assets" &&
            ! { grep -qx PATCHES-windows.txt <<<"$assets" && listed "gridcraft-$v-windows-x64.msi"; }; then
            legs="$(jq -c '. + [{"os": "windows-latest", "platform": "windows", "targets": "x86_64-pc-windows-msvc", "artifact": "release-windows-x64", "binary": "target/x86_64-pc-windows-msvc/release/gridcraft.exe"}]' <<<"$legs")"
          fi
          if ! grep -qx PATCH-UFFICIALE-mac.txt <<<"$assets" && ! listed "gridcraft-$v-macos-universal.dmg"; then
            legs="$(jq -c '. + [{"os": "macos-15", "platform": "mac", "targets": "aarch64-apple-darwin, x86_64-apple-darwin", "artifact": "release-macos", "binary": "target/macos-package/GridCraft.app/Contents/MacOS/GridCraft"}]' <<<"$legs")"
          fi
          build="$(jq -r 'if length > 0 then "true" else "false" end' <<<"$legs")"
          {
            echo "tag=$tag"
            echo "build=$build"
            echo "exists=$exists"
            echo "matrix={\"include\":$legs}"
          } >> "$GITHUB_OUTPUT"
          echo "GridCraft $tag: exists=$exists, to build: $(jq -r 'map(.platform) | join(", ")' <<<"$legs")"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: patch
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/gridcraft
          ref: ${{ needs.plan.outputs.tag }}
          path: gridcraft
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.platform == 'windows'
        with:
          repository: kcobelli-pixel/pdfcraft-stampa
          path: stampa
          persist-credentials: false
      # Before the patches: the print fix runs cargo.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
      - name: Apply the patches
        id: fix
        shell: bash
        run: |
          set +e
          fixes='' official=false
          python3 -I patch/add_italian.py gridcraft patch/catalog/it.rs; code=$?
          if [ "$code" -eq 0 ]; then fixes=italian; elif [ "$code" -eq 3 ]; then official=true; else exit "$code"; fi
          # The print fix is for Windows drivers only.
          if [ "$PLATFORM" = windows ]; then
            bash stampa/apply_print_fix.sh gridcraft; code=$?
            if [ "$code" -eq 0 ]; then fixes="$fixes print"; elif [ "$code" -ne 3 ]; then exit "$code"; fi
          fi
          fixes="${fixes# }"
          echo "fixes=$fixes" >> "$GITHUB_OUTPUT"
          echo "official=$official" >> "$GITHUB_OUTPUT"
          echo "patches applied: ${fixes:-none}"
      - name: Read the craft-fonts pin
        id: fonts
        if: steps.fix.outputs.fixes != ''
        shell: bash
        run: |
          # Only the 40 hex digits: a CRLF checkout, quotes or a comment can't leak into the ref.
          ref="$(sed -n 's/^ *craft-fonts-ref: *["'\'']\{0,1\}\([0-9a-f]\{40\}\).*/\1/p' gridcraft/.github/workflows/release.yml | head -n1)"
          if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::unexpected craft-fonts-ref '$ref'"; exit 1; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.fix.outputs.fixes != ''
        with:
          repository: storytold/craft-fonts
          ref: ${{ steps.fonts.outputs.ref }}
          path: craft-fonts
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.fix.outputs.fixes != ''
        with:
          workspaces: gridcraft
      - name: Test the Italian wiring
        if: contains(steps.fix.outputs.fixes, 'italian') && runner.os == 'Windows'
        working-directory: gridcraft
        run: cargo test --locked -p gridcraft-ui-egui --lib -- i18n backstage
      - name: Install WiX
        if: steps.fix.outputs.fixes != '' && runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - name: Package for Windows (unsigned)
        if: steps.fix.outputs.fixes != '' && runner.os == 'Windows'
        shell: pwsh
        # The packaging scripts run cargo in the current directory.
        working-directory: gridcraft
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: '1'
        run: ./packaging/windows/package.ps1 -Arch x64
      - name: Package for macOS (ad-hoc signed)
        if: steps.fix.outputs.fixes != '' && runner.os == 'macOS'
        working-directory: gridcraft
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: '1'
        run: packaging/macos/package.sh --arch universal
      - name: Check the build has the patches
        if: steps.fix.outputs.fixes != ''
        shell: bash
        env:
          BINARY: gridcraft/${{ matrix.binary }}
          FIXES: ${{ steps.fix.outputs.fixes }}
        run: |
          # Strings only the patched code carries: the language's name and the GDI retry's receipt.
          for fix in $FIXES; do
            case "$fix" in
              italian) mark='Italiano' ;;
              print) mark='through GDI' ;;
            esac
            LC_ALL=C grep -a -q "$mark" "$BINARY" || { echo "::error::$fix patch missing from $BINARY"; exit 1; }
          done
          ls -l gridcraft/dist/release
      # After packaging, which owns dist/release.
      - name: Write the receipt and the markers
        shell: bash
        env:
          FIXES: ${{ steps.fix.outputs.fixes }}
          OFFICIAL: ${{ steps.fix.outputs.official }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          out=gridcraft/dist/release
          mkdir -p "$out"
          if [ "$OFFICIAL" = true ]; then
            echo "GridCraft $TAG ha già l'italiano ufficiale: scegli Italiano nel menu della lingua." > "$out/ITALIANO-UFFICIALE.txt"
          fi
          if [ -n "$FIXES" ]; then
            printf '%s\n' $FIXES > "$out/PATCHES-$PLATFORM.txt"
          else
            echo "GridCraft $TAG contiene già tutto quello che aggiungeva la patch: non serve più." > "$out/PATCH-UFFICIALE-$PLATFORM.txt"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: gridcraft/dist/release/*
          if-no-files-found: error

  release:
    needs: [plan, build]
    # Also after a failed leg: whatever did build is published.
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      EXISTS: ${{ needs.plan.outputs.exists }}
      BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Publish the release
        run: |
          mkdir -p artifacts sums
          brother='la correzione per le stampanti Brother (se il driver rifiuta la stampa XPS, errore 0x80040003 "Interfaccia non supportata", il documento viene stampato tramite GDI)'
          notes="GridCraft $TAG ricompilato da storytold/gridcraft $TAG con il catalogo italiano di questo repository (le frasi non ancora tradotte restano in inglese) e, su Windows, $brother. Build non ufficiali e non firmate. Si installano con la patch della release strumenti (Windows: Applica-italiano.cmd; Mac: Applica-italiano.command)."
          cd artifacts
          if [ -z "$(ls)" ]; then echo "::error::nothing was built"; exit 1; fi
          if [ -f ITALIANO-UFFICIALE.txt ]; then
            notes="GridCraft $TAG include già l'italiano ufficiale: su Windows la patch aggiunge solo $brother."
            [ ! -f PATCH-UFFICIALE-windows.txt ] || notes="GridCraft $TAG include già ufficialmente l'italiano e la correzione della stampa: non serve nessuna patch."
          fi
          packages="$(ls | grep -v -e '^ITALIANO-UFFICIALE\.txt$' -e '^PATCH-UFFICIALE-' -e '^PATCHES-' || true)"
          if [ -n "$packages" ]; then
            # Checksums of the new packages, plus the published ones they don't replace.
            sha256sum -- $packages > ../sums/new.txt
            : > ../sums/old.txt
            if [ "$EXISTS" = "true" ] && gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx SHA256SUMS.txt; then
              gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS.txt -O ../sums/old.txt --clobber
            fi
            awk 'NR == FNR { replaced[$2] = 1; next } !($2 in replaced)' ../sums/new.txt ../sums/old.txt > ../sums/kept.txt
            sort -k2 ../sums/kept.txt ../sums/new.txt > ../sums/SHA256SUMS.txt
            cat ../sums/SHA256SUMS.txt
          fi
          if [ "$EXISTS" = "true" ]; then
            # Packages first and the checksums last: a download in between fails its hash check.
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber -- *
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$notes"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "GridCraft $TAG in italiano" --notes "$notes" --latest=false -- *
          fi
          if [ -f ../sums/SHA256SUMS.txt ]; then
            # Every package on the release must keep its line, or its patch would read "not ready".
            for a in $(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -vx -e SHA256SUMS.txt -e ITALIANO-UFFICIALE.txt -e 'PATCH-UFFICIALE-.*' -e 'PATCHES-.*'); do
              grep -q "  $a\$" ../sums/SHA256SUMS.txt || { echo "::error::SHA256SUMS.txt would miss $a"; exit 1; }
            done
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber -- ../sums/SHA256SUMS.txt
          fi
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "::error::a platform failed to build; the next run retries it"; exit 1
          fi
      # shortcut: GitHub turns off scheduled workflows after 60 days without repository activity;
      # one commit per upstream release keeps it on while GridCraft keeps releasing.
      - name: Record the version
        if: env.EXISTS == 'false'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "$TAG" >> versions.txt
          git add versions.txt
          git commit -m "chore: built $TAG"
          # main may have moved during the build.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

# Rebuilds each new GridCraft release (storytold/gridcraft) with the Italian catalog and publishes
# the Windows x64 MSI and portable zip as a release of this repository, tagged like upstream.
# windows/GridCraft-Italiano.ps1 installs the build matching the installed GridCraft version.
name: Build Italian GridCraft

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'GridCraft tag, e.g. v0.10.0 (empty: the latest release)'
        required: false

permissions: {}

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      build: ${{ steps.pick.outputs.build }}
    steps:
      - name: Pick the tag
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$(gh release view -R storytold/gridcraft --json tagName --jq .tagName)}"
          # The tag comes from upstream: only plain release tags reach a shell or a file name.
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::unexpected tag '$tag'"; exit 1; fi
          if err="$(gh release view "$tag" -R "$GITHUB_REPOSITORY" 2>&1 >/dev/null)"; then
            build=false
          elif [[ "$err" == *"release not found"* ]]; then
            build=true
          else
            echo "::error::checking for $tag failed: $err"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "GridCraft $tag: build=$build"

  windows-x64:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      official: ${{ steps.wire.outputs.official }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: patch
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/gridcraft
          ref: ${{ needs.plan.outputs.tag }}
          path: gridcraft
          persist-credentials: false
      - name: Wire Italian
        id: wire
        shell: bash
        run: |
          set +e
          python -I patch/add_italian.py gridcraft patch/catalog/it.rs
          code=$?
          if [ "$code" -eq 3 ]; then echo "official=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "official=false" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Read the craft-fonts pin
        id: fonts
        if: steps.wire.outputs.official == 'false'
        shell: bash
        run: |
          # Only the 40 hex digits: a CRLF checkout, quotes or a comment can't leak into the ref.
          ref="$(sed -n 's/^ *craft-fonts-ref: *["'\'']\{0,1\}\([0-9a-f]\{40\}\).*/\1/p' gridcraft/.github/workflows/release.yml | head -n1)"
          if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::unexpected craft-fonts-ref '$ref'"; exit 1; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.wire.outputs.official == 'false'
        with:
          repository: storytold/craft-fonts
          ref: ${{ steps.fonts.outputs.ref }}
          path: craft-fonts
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        if: steps.wire.outputs.official == 'false'
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.wire.outputs.official == 'false'
        with:
          workspaces: gridcraft
      - name: Test the Italian wiring
        if: steps.wire.outputs.official == 'false'
        working-directory: gridcraft
        run: cargo test --locked -p gridcraft-ui-egui --lib -- i18n backstage
      - name: Install WiX
        if: steps.wire.outputs.official == 'false'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - name: Package (unsigned)
        if: steps.wire.outputs.official == 'false'
        shell: pwsh
        # package.ps1 runs cargo in the current directory.
        working-directory: gridcraft
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: '1'
        run: ./packaging/windows/package.ps1 -Arch x64
      - name: Check the build is Italian
        if: steps.wire.outputs.official == 'false'
        shell: bash
        run: |
          exe="$(find gridcraft/target -path '*x86_64-pc-windows-msvc/release/gridcraft.exe' | head -n1)"
          LC_ALL=C grep -a -q 'Italiano' "$exe" || { echo "::error::no Italian in $exe"; exit 1; }
          ls -l gridcraft/dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.wire.outputs.official == 'false'
        with:
          name: release-windows-x64
          path: gridcraft/dist/release/*
          if-no-files-found: error

  release:
    needs: [plan, windows-x64]
    if: needs.plan.outputs.build == 'true' && needs.windows-x64.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      OFFICIAL: ${{ needs.windows-x64.outputs.official }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.OFFICIAL == 'false'
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Publish the release
        run: |
          mkdir -p artifacts
          cd artifacts
          if [ "$OFFICIAL" = "true" ]; then
            echo "GridCraft $TAG ha già l'italiano ufficiale: scegli Italiano nel menu della lingua." > ITALIANO-UFFICIALE.txt
            notes="GridCraft $TAG include già l'italiano ufficiale: non serve nessuna patch."
          else
            sha256sum -- * | tee SHA256SUMS.txt
            notes="GridCraft $TAG ricompilato da storytold/gridcraft $TAG con il catalogo italiano di questo repository. Build non ufficiale e non firmata. Le frasi non ancora tradotte restano in inglese. Si installa con windows/GridCraft-Italiano.ps1."
          fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "GridCraft $TAG in italiano" --notes "$notes" --latest=false -- *
      # shortcut: GitHub turns off scheduled workflows after 60 days without repository activity;
      # one commit per upstream release keeps it on while GridCraft keeps releasing.
      - name: Record the version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "$TAG" >> versions.txt
          git add versions.txt
          git commit -m "chore: built $TAG"
          # main may have moved during the build.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
